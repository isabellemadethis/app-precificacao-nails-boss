<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- viewport-fit=cover libera as safe-areas do iPhone (notch + home bar).
         maximum-scale + user-scalable=no travam o pinch-zoom: o app abre já no
         tamanho certo e só rola, nunca dá zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Precificação na palma da mão · Nails Boss por Mayhara Gonçalves" />

    <!-- PWA · instala como app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#3D0D1A" />

    <!-- iOS · abre em tela cheia (standalone), sem barra do Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nails Boss" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Nails Boss · Precificação</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
